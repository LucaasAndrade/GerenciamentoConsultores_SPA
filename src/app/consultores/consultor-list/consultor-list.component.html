<div class="container">
  <div class="header">
    <h1>Consultores</h1>
    <button class="add-button" (click)="adicionarConsultor()">Adicionar Novo</button>
  </div>

  <table class="consultor-table">
    <thead>
      <tr>
        <th>Nome Completo</th>
        <th>Email</th>
        <th>Área de Atuação</th>
        <th>Data de Cadastro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let consultor of consultores">
        <td>{{ consultor.nome }}</td>
        <td>{{ consultor.email }}</td>
        <td>{{ consultor.areaDeAtuacao.nome }}</td>
        <td>{{ consultor.dataDeCriacao | date: 'dd/MM/yyyy' }}</td>
        <td class="actions">
          <button class="edit-button" (click)="editarConsultor(consultor.id)">Editar</button>
          <button class="delete-button" (click)="excluirConsultor(consultor.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="consultores.length === 0" class="empty-state">
    <p>Nenhum consultor cadastrado.</p>
  </div>
</div>
