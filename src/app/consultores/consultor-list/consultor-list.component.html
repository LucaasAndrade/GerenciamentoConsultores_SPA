<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1>Consultores</h1>
    <div class="d-flex gap-2">
      <input type="text" class="form-control" placeholder="Buscar consultor..." [(ngModel)]="searchTerm" (input)="filterConsultores()">
      <button class="btn btn-success" (click)="adicionarConsultor()">Adicionar</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Nome Completo</th>
          <th>Email</th>
          <th>Área de Atuação</th>
          <th>Data de Cadastro</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let consultor of consultores">
          <td>{{ consultor.nome }}</td>
          <td>{{ consultor.email }}</td>
          <td>{{ consultor.area_atuacao }}</td>
          <td>{{ consultor.data_criacao | date: 'dd/MM/yyyy' }}</td>
          <td class="text-end">
            <button class="btn btn-primary btn-sm me-2" (click)="editarConsultor(consultor.id_consultor)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="excluirConsultor(consultor.id_consultor)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="consultores.length === 0" class="alert alert-info mt-4" role="alert">
    Nenhum consultor cadastrado.
  </div>
</div>
