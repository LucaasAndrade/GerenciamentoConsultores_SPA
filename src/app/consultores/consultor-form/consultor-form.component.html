<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title mb-4">Criar Novo Consultor</h2>
      <form [formGroup]="consultorForm" (ngSubmit)="onSubmit()">

        <!-- Campo Nome Completo -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome Completo</label>
          <input id="nome" formControlName="nome" class="form-control"
                 [ngClass]="{ 'is-invalid': consultorForm.controls['nome'].invalid && (consultorForm.controls['nome'].dirty || consultorForm.controls['nome'].touched) }"
                 placeholder="Digite o nome completo">
          <div *ngIf="consultorForm.controls['nome'].invalid && (consultorForm.controls['nome'].dirty || consultorForm.controls['nome'].touched)" class="invalid-feedback">
            O nome é obrigatório.
          </div>
        </div>

        <!-- Campo Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" formControlName="email" class="form-control"
                 [ngClass]="{ 'is-invalid': consultorForm.controls['email'].invalid && (consultorForm.controls['email'].dirty || consultorForm.controls['email'].touched) }"
                 placeholder="exemplo@email.com">
          <div *ngIf="consultorForm.controls['email'].invalid && (consultorForm.controls['email'].dirty || consultorForm.controls['email'].touched)" class="invalid-feedback">
            <span *ngIf="consultorForm.controls['email'].errors?.['required']">O email é obrigatório.</span>
            <span *ngIf="consultorForm.controls['email'].errors?.['email']">Formato de email inválido.</span>
          </div>
        </div>

        <!-- Campo Telefone -->
        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input id="telefone" formControlName="telefone" class="form-control"
                 [ngClass]="{ 'is-invalid': consultorForm.controls['telefone'].invalid && (consultorForm.controls['telefone'].dirty || consultorForm.controls['telefone'].touched) }"
                 placeholder="(99) 99999-9999">
          <div *ngIf="consultorForm.controls['telefone'].invalid && (consultorForm.controls['telefone'].dirty || consultorForm.controls['telefone'].touched)" class="invalid-feedback">
            O telefone é obrigatório.
          </div>
        </div>

        <!-- Campo Área de Atuação -->
        <div class="mb-3">
          <label for="area_atuacao" class="form-label">Área de Atuação</label>
          <input id="area_atuacao" formControlName="area_atuacao" class="form-control"
                 [ngClass]="{ 'is-invalid': consultorForm.controls['area_atuacao'].invalid && (consultorForm.controls['area_atuacao'].dirty || consultorForm.controls['area_atuacao'].touched) }"
                 placeholder="Digite a área de atuação">
          <div *ngIf="consultorForm.controls['area_atuacao'].invalid && (consultorForm.controls['area_atuacao'].dirty || consultorForm.controls['area_atuacao'].touched)" class="invalid-feedback">
            A área de atuação é obrigatória.
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="consultorForm.invalid">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
