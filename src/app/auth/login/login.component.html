<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="login">Login</label>
        <input id="login" type="text" formControlName="login" placeholder="Digite seu login">
        <div *ngIf="loginForm.controls['login'].invalid && (loginForm.controls['login'].dirty || loginForm.controls['login'].touched)" class="error-message">
          <span *ngIf="loginForm.controls['login'].errors?.['required']">O login é obrigatório.</span>
        </div>
      </div>
      <div class="form-field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Digite sua senha">
        <div *ngIf="loginForm.controls['password'].invalid && (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)" class="error-message">
          A senha é obrigatória.
        </div>
      </div>
      <div *ngIf="loginError" class="error-message">
        {{ loginError }}
      </div>
      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
  </div>
</div>
