<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Administradores</h1>
    <a routerLink="/administrador-form" class="btn btn-success">Novo Administrador</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Login</th>
          <th>Data de Criação</th>
          <th>Último Update</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let administrador of administradores">
          <td>{{ administrador.login }}</td>
          <td>{{ administrador.data_criacao | date: 'dd/MM/yyyy' }}</td>
          <td>{{ administrador.ultimo_update | date: 'dd/MM/yyyy' }}</td>
          <td class="text-end">
            <a [routerLink]="['/administrador-form', administrador.id_admin]" class="btn btn-primary btn-sm me-2">Editar</a>
            <button (click)="deleteAdministrador(administrador.id_admin!)" class="btn btn-danger btn-sm">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="administradores.length === 0" class="alert alert-info mt-4" role="alert">
    Nenhum administrador cadastrado.
  </div>
</div>
